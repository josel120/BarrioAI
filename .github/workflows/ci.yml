# BarrioAI CI: typecheck + lint + build + e2e. No secrets required.
name: CI

on:
  push:
  pull_request:

# Cancel stale runs on the same branch so PRs get fast, current signals.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the local toolchain (Node 24). See docs/CI_CD.md.
          node-version: "24"
          cache: npm
      # Validates that package-lock.json is in sync with package.json.
      - run: npm ci

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    needs: install
    runs-on: ubuntu-latest
    # Empty-but-present env: exercises the app's lazy-client behavior
    # (build must succeed without real credentials).
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      META_API_BASE_URL: ""
      META_API_KEY: ""
      META_VISION_MODEL: ""
      META_EMBEDDING_MODEL: ""
      OPENAI_API_KEY: ""
      EMBEDDING_MODEL: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          # Unique key per commit; falls back to the newest cache for
          # this lockfile so unchanged builds stay incremental.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  e2e:
    name: E2E
    needs: install
    runs-on: ubuntu-latest
    # Fail fast instead of hanging on a slow mirror: apt once served
    # system deps at 49 kB/s for 9 minutes (run 40541906829).
    timeout-minutes: 15
    # System deps + browsers come from the image: no apt downloads.
    # The chromium binary is still installed from the lockfile below,
    # so it always matches @playwright/test even if this tag drifts.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Seconds, not minutes: browser from the Playwright CDN, system
      # libs already in the image — no --with-deps/apt involved.
      - name: Install Playwright chromium
        run: npx playwright install chromium
      # Builds + starts production via webServer (CI in playwright.config);
      # the suite stubs /api/search,
      # so no API keys are needed. Chromium only: the `edge` project
      # needs MS Edge, which the image doesn't ship.
      - run: npx playwright test --project=chromium
      - name: Upload E2E failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          # Traces (on retry) and failure screenshots. Empty on green
          # runs, hence if-no-files-found: ignore.
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
